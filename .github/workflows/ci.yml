name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run exhaustive validation
        run: python -m hve.cli validate

  c11-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler (${{ matrix.compiler }})
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Configure CMake (C11 strict warnings)
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            cmake -S csrc -B build-c -DCMAKE_C_COMPILER=gcc
          else
            cmake -S csrc -B build-c -DCMAKE_C_COMPILER=clang
          fi

      - name: Build C11 reference core
        run: cmake --build build-c

      - name: Run C11 exhaustive tests
        run: ctest --test-dir build-c --output-on-failure

      - name: Record environment
        run: |
          echo "Compiler: ${{ matrix.compiler }}"
          ${{ matrix.compiler }} --version
          echo "CMake: $(cmake --version | head -1)"
          echo "OS: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          echo "Commit: $(git rev-parse --short HEAD)"
